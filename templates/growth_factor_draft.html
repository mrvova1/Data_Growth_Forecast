<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Добавление — Прогноз роста объёма данных</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="phone-shell">
    <main class="app-screen draft-screen">
        <header class="screen-header">
            <h1>{% if is_exist %}Публикация услуги{% else %}Создание услуги{% endif %}</h1>
        </header>

        {% if not is_exist %}
        <form class="growth-factor-form" action="/growth-factor/create" method="POST">
            <fieldset>
                <legend>Медиа</legend>
                <img src="{{ growth_factor.image_url }}" alt="{{ growth_factor.growth_factor_name }}">
                {% comment %} <img src="{% if growth_factor and growth_factor.image_url %}{{ growth_factor.image_url }}{% else %}/static/images/default.png{% endif %}"> {% endcomment %}

                <label class="field">
                    <span>Изображение</span>
                    <input type="file" name="image_file" accept="image/*">
                </label>
                <video autoplay loop muted playsinline poster="{{ growth_factor.image_url }}">
                    <source src="{{ growth_factor.video_url }}" type="video/mp4">
                    {% comment %} <source src="{% if growth_factor and growth_factor.video_url %}{{ growth_factor.video_url }}{% else %}/static/videos/default.mp4{% endif %}" type="video/mp4"> {% endcomment %}
                </video>
                <label class="field">
                    <span>Видео</span>
                    <input type="file" name="video_file" accept="video/*">
                </label>
            </fieldset>

            <fieldset>
                <legend>Основная информация</legend>
                <label class="field">
                    <span>Название фактора роста *</span>
                    <input type="text" name="growth_factor_name" required placeholder="Введите название...">
                </label>
            </fieldset>

            <button class="action-button" type="submit">Далее</button>
        </form>

        {% else %}
        <form class="growth-factor-form" action="/growth-factor/publish" method="POST">
            <fieldset>
                <legend>Медиа</legend>
                <img src="{{ growth_factor.image_url }}" alt="{{ growth_factor.growth_factor_name }}">

                <label class="field">
                    <span>Изображение</span>
                    <input type="file" name="image_file" accept="image/*">
                </label>
                <video autoplay loop muted playsinline poster="{{ growth_factor.image_url }}">
                    <source src="{{ growth_factor.video_url }}" type="video/mp4">
                </video>
                <label class="field">
                    <span>Видео</span>
                    <input type="file" name="video_file" accept="video/*">
                </label>
            </fieldset>

            <fieldset>
                <legend>Текст</legend>
                <label class="field">
                    <span>Название фактора роста</span>
                    <input type="text" value="{{ growth_factor.growth_factor_name }}" disabled style="opacity:0.7;">
                </label>
                <label class="field">
                    <span>Краткая информация / Описание *</span>
                    <textarea name="growth_factor_description" rows="5" required placeholder="Заполните описание по теме..."></textarea>
                </label>
            </fieldset>

            <fieldset>
                <legend>Значения по теме</legend>
                <div class="form-grid">
                    <label class="field">
                        <span>Коэффициент роста *</span>
                        <input type="number" name="growth_coefficient" step="0.01" min="1.00" max="2.00" value="1.00" required>
                    </label>
                    <label class="field">
                        <span>Коэффициент объема *</span>
                        <input type="number" name="storage_impact_coefficient" step="0.01" min="0.00" max="2.00" value="1.00" required>
                    </label>
                </div>
            </fieldset>

            <button class="action-button" type="submit">Опубликовать</button>
        </form>
        {% endif %}
    </main>

    {% set active_tab = 'draft' %}
    {% include 'base_nav.html' %}
</div>
</body>
</html>
